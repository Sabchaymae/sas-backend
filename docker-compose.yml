# ============================================
# Oriotel ERP — Microservices Docker Compose
# ============================================
# Usage:
#   cp .env.docker .env
#   docker compose up -d --build
# ============================================

x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  working_dir: /var/www/html
  networks:
    - oriotel-network
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "sh", "-c", "kill -0 1 && php-fpm -t"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 5

x-php-environment: &php-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: ${MYSQL_USER:-oriotel}
  DB_PASSWORD: ${MYSQL_PASSWORD:-oriotel_secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  APP_ENV: local
  APP_DEBUG: "true"
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
  SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8080,localhost:3000,127.0.0.1
  COMPOSER_PROCESS_TIMEOUT: 0

x-nginx-sidecar: &nginx-sidecar
  image: nginx:1.25-alpine
  restart: unless-stopped
  volumes:
    - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
  networks:
    - oriotel-network

services:

  # ===========================
  #  INFRASTRUCTURE
  # ===========================

  mysql:
    image: mysql:8.0
    container_name: oriotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oriotel_root}
      MYSQL_USER: ${MYSQL_USER:-oriotel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oriotel_secret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - oriotel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oriotel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - oriotel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: oriotel-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oriotel_root}
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - oriotel-network
    depends_on:
      mysql:
        condition: service_healthy

  # ===========================
  #  API GATEWAY
  # ===========================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: oriotel-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    networks:
      - oriotel-network
    depends_on:
      - identity-nginx
      - operations-nginx
      - communication-nginx
      - subscription-nginx
      - ocr-python

  # ===========================
  #  SERVICE: IDENTITY
  # ===========================

  identity-php:
    <<: *php-service
    container_name: oriotel-identity-php
    volumes:
      - ./service-identity:/var/www/html
    environment:
      <<: *php-env
      DB_DATABASE: oriotel_identity
      APP_NAME: "Oriotel Identity"
      APP_KEY: ${IDENTITY_APP_KEY:-base64:YCyjgeuQI5pL7RczXa1TjrViI1kOvzcBtJCqSh59PCU=}

  identity-nginx:
    <<: *nginx-sidecar
    container_name: oriotel-identity-nginx
    environment:
      PHP_FPM_HOST: identity-php
    volumes:
      - ./service-identity:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8082:80"
    depends_on:
      - identity-php

  # ===========================
  #  SERVICE: OPERATIONS
  # ===========================

  operations-php:
    <<: *php-service
    container_name: oriotel-operations-php
    volumes:
      - ./service-operations:/var/www/html
    environment:
      <<: *php-env
      DB_DATABASE: oriotel_operations
      APP_NAME: "Oriotel Operations"
      APP_KEY: ${OPERATIONS_APP_KEY:-base64:OpKeyPlaceholder1234567890ABCDEFGH=}

  operations-nginx:
    <<: *nginx-sidecar
    container_name: oriotel-operations-nginx
    environment:
      PHP_FPM_HOST: operations-php
    volumes:
      - ./service-operations:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - operations-php

  # ===========================
  #  SERVICE: COMMUNICATION
  # ===========================

  communication-php:
    <<: *php-service
    container_name: oriotel-communication-php
    volumes:
      - ./service-communication:/var/www/html
    environment:
      <<: *php-env
      DB_DATABASE: oriotel_communication
      APP_NAME: "Oriotel Communication"
      APP_KEY: ${COMMUNICATION_APP_KEY:-base64:CommKeyPlaceholder1234567890ABCDE=}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-oriotel}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-oriotel_reverb_key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-oriotel_reverb_secret}
      REVERB_HOST: ${REVERB_HOST:-reverb}
      REVERB_PORT: 8080
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      REVERB_BROADCAST_HOST: reverb

  communication-nginx:
    <<: *nginx-sidecar
    container_name: oriotel-communication-nginx
    environment:
      PHP_FPM_HOST: communication-php
    volumes:
      - ./service-communication:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - communication-php

  # ===========================
  #  LARAVEL REVERB (WEBSOCKETS)
  # ===========================

  reverb:
    <<: *php-service
    container_name: oriotel-reverb
    volumes:
      - ./service-communication:/var/www/html
    ports:
      - "${REVERB_PORT:-8085}:8080"
    environment:
      <<: *php-env
      DB_DATABASE: oriotel_communication
      APP_NAME: "Oriotel Reverb"
      APP_KEY: ${COMMUNICATION_APP_KEY:-base64:CommKeyPlaceholder1234567890ABCDE=}
      REVERB_APP_ID: ${REVERB_APP_ID:-oriotel}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-oriotel_reverb_key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-oriotel_reverb_secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================
  #  SERVICE: SUBSCRIPTION
  # ===========================

  subscription-php:
    <<: *php-service
    container_name: oriotel-subscription-php
    volumes:
      - ./service-subscription:/var/www/html
    environment:
      <<: *php-env
      DB_DATABASE: oriotel_subscription
      APP_NAME: "Oriotel Subscription"
      APP_KEY: ${SUBSCRIPTION_APP_KEY:-base64:SubKeyPlaceholder1234567890ABCDEF=}

  subscription-nginx:
    <<: *nginx-sidecar
    container_name: oriotel-subscription-nginx
    environment:
      PHP_FPM_HOST: subscription-php
    volumes:
      - ./service-subscription:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - subscription-php

# ===========================
#  SERVICE: OCR (PaddleOCR)
# ===========================

  ocr-python:
    build:
      context: ./service-ocr
      dockerfile: Dockerfile
    container_name: oriotel-ocr-python
    restart: unless-stopped
    networks:
      - oriotel-network
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

# ===========================
#  VOLUMES
# ===========================

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ===========================
#  NETWORKS
# ===========================

networks:
  oriotel-network:
    driver: bridge
    name: oriotel-network
